# ==============================================================================
# ~/.tmux.conf - WSL 高性能现代化通用配置
# ==============================================================================

# 1. 基础体验（深度鼠标支持：每个标签拥有独立 50000 行历史，触控板丝滑滚动，绝对不串台）
set -g mouse on                        # 开启鼠标深度支持：触控板自然平滑滚屏，彻底杜绝日志截断与串台
set -s escape-time 10                  # 消除 Esc 键延迟（优化终端 TUI 与 Vim 响应）
set -g focus-events on                 # 允许向终端应用程序传递焦点事件
set -g history-limit 50000             # 增大回滚缓冲区（保存 5 万行历史输出）

# 2. 窗口与窗格编号优化
set -g base-index 1                    # 窗口编号从 1 开始（对应键盘数字 1~9）
setw -g pane-base-index 1              # 窗格编号从 1 开始
set -g renumber-windows on             # 关闭中间窗口后自动重新编号，避免跳号

# 3. 颜色与终端渲染（支持 24-bit TrueColor 真彩色与 256 色）
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# 终端渲染与独立备用屏幕（保留备用屏幕，让每个标签各自拥有独立的 50000 行历史缓冲区，互不继承污染）
set -s terminal-overrides "xterm*:RGB:E3=\\E[3J"

# 一键翻阅历史（无需前缀，翻回底部自动退出浏览模式）
bind-key -n S-PageUp copy-mode -eu      # Shift+PageUp: 直接向上翻一页
bind-key -n M-u copy-mode -eu           # Alt+u: 同上（单手流）

# 4. 直观的分屏快捷键（继承当前工作路径）
bind | split-window -h -c "#{pane_current_path}"   # 前缀 + | 左右分屏
bind - split-window -v -c "#{pane_current_path}"   # 前缀 + - 上下分屏
bind c new-window -c "#{pane_current_path}"        # 前缀 + c 新建窗口（全新独立 0 历史）
bind R command-prompt -I "#W" "rename-window '%%'" # 前缀 + R 窗口重命名（备用快捷键，避免中文逗号冲突）
bind T command-prompt -p "🏷️ 设置窗格标题 (Pane Title):" "select-pane -T '%%'" # 前缀 + T 窗格重命名
# 窗格标题栏仅在「多窗格且未放大」时显示；单窗格时关闭，保持干净界面
set -g pane-border-status off
set-hook -g window-layout-changed 'if -F "#{&&:#{>:#{window_panes},1},#{?window_zoomed_flag,0,1}}" "setw pane-border-status top" "setw pane-border-status off"'
set-hook -g after-resize-pane 'if -F "#{&&:#{>:#{window_panes},1},#{?window_zoomed_flag,0,1}}" "setw pane-border-status top" "setw pane-border-status off"'
set -g pane-border-format " [ #{pane_index}: #{?pane_active,#[bold]#[fg=colour208],#[fg=colour245]}#{pane_title}#[default] ] "
bind Enter respawn-pane -k \; display-message "🔄 窗格已原地重新连接！"  # 前缀 + Enter 原地一键重连当前窗格
bind K send-keys -R C-l \; clear-history \; display-message "🧹 当前窗格屏幕与历史已清空"  # 前缀 + K 清屏并清空当前窗格历史


# 5. 极致优雅的鼠标交互体系 (全覆盖秒复制 + GB18030 彻底杜绝中文乱码)
set -s set-clipboard on

# 彻底解绑所有 tmux 默认的右键上下文长菜单 (display-menu)，杜绝弹窗干扰
unbind-key -T root MouseDown3Pane
unbind-key -T root MouseUp3Pane
unbind-key -T root M-MouseDown3Pane
unbind-key -T copy-mode MouseDown3Pane
unbind-key -T copy-mode MouseUp3Pane
unbind-key -T copy-mode-vi MouseDown3Pane
unbind-key -T copy-mode-vi MouseUp3Pane

# A. 触控板自然平滑滚屏：双指往上滑无缝唤出历史（每次微调 2 行，丝滑平稳）；滑回底部自动平滑退出！
bind-key -T root WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -T copy-mode WheelUpPane send-keys -X -N 2 scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X -N 2 scroll-down

# B. 鼠标左键划选：划选结束一松手，自动静默送入 Windows 剪贴板（经由 wclip 解决中文乱码）
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"

# C. 鼠标右键一键复制：在划选模式下，按右键立即复制到 Windows 剪贴板并退出选区
bind-key -T copy-mode MouseDown3Pane send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T copy-mode MouseUp3Pane send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T copy-mode-vi MouseDown3Pane send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T copy-mode-vi MouseUp3Pane send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"

# D. 快捷键 Ctrl+C 与 Enter 复制：支持在划选高亮时直接按 Ctrl+C 或 Enter 复制并退出
bind-key -T copy-mode C-c send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T copy-mode-vi C-c send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"

# E. 双击选词秒复制、三击整行秒复制（全自动送入 Windows 剪贴板）
bind-key -T root DoubleClick1Pane select-pane -t = \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T root TripleClick1Pane select-pane -t = \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"

# F. 单击任意位置解除选区高亮
bind-key -T copy-mode MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

# G. 键盘辅助：复制模式下按 y 复制并退出，按 q 或 Esc 直接退出
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "/home/zxf/.local/bin/wclip"
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# 鼠标模式快捷切换（按 Ctrl+b m 可以在「tmux 鼠标模式」与「终端纯原生划词模式」间切换）
bind-key m set -g mouse\; display-message "Mouse mode: #{?mouse,ON,OFF}"

# 6. 配置热重载快捷键（修改配置后按 Ctrl+b r 立即生效）
bind r source-file ~/.tmux.conf \; display-message "✅ ~/.tmux.conf 已重新加载！"

# 7. 优雅现代的状态栏设计
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# 状态栏左侧：显示当前会话名（高亮青色）
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=default,fg=#89b4fa] #[default]"

# 状态栏右侧：显示当前时间
set -g status-right-length 40
set -g status-right "#[fg=#6c7086]│ #[fg=#a6adc8]%H:%M #[default]"

# 窗口标签页样式
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#f5c2e7,bold] #I:#W #[default]"
setw -g window-status-separator ""

# 8. 同步广播快捷键绑定（按 Ctrl+b y 快速切换当前窗口的输入同步）
bind-key y set-window-option synchronize-panes\; display-message "synchronize-panes: #{?pane_synchronized,ON,OFF}"

# 8.1 免前缀极速切项目与现代浮窗（针对 agy 终端深度优化，单键穿透，避免按键误触）
# 使用中文输入法 100% 绝不拦截的物理功能键与常用 Alt 键
bind-key -n F1 switch-client -p                                                   # F1: 上一个项目
bind-key -n F2 switch-client -n                                                   # F2: 下一个项目
bind-key -n F3 display-popup -E -w 50% -h 40% -b rounded -T " 🚀 切换项目 " "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='🚀 切换项目 > ' | xargs -r tmux switch-client -t"
bind-key -n F4 switch-client -l                                                   # F4: 类似 Alt+Tab 两项目横跳
bind-key -n F5 resize-pane -Z                                                     # F5: 单键当前窗格全屏放大/还原（彻底解决分屏划选跨屏问题）
bind-key -n F6 display-popup -d "#{pane_current_path}" -xC -yC -w 85% -h 80% -E -b rounded -T " 🤖 Antigravity AI 伴写助手 (按 Alt+a 或 F6 隐退/唤出) " "/home/zxf/.local/bin/tmux_popup_ai.sh '#{pane_current_path}'"
bind-key -n F7 display-popup -d "#{pane_current_path}" -xC -yC -w 85% -h 80% -E -b rounded -T " ⚡ 极速命令运行台 (按 Alt+r 或 F7 隐退/唤出) " "/home/zxf/.local/bin/tmux_popup_runner.sh '#{pane_current_path}'"

# 极客 Alt 快捷键（无缝单手流）
bind-key -n M-z resize-pane -Z                                                     # Alt+z: 窗格全屏放大/还原
bind-key -n M-a display-popup -d "#{pane_current_path}" -xC -yC -w 85% -h 80% -E -b rounded -T " 🤖 Antigravity AI 伴写助手 (按 Alt+a 隐退/唤出) " "/home/zxf/.local/bin/tmux_popup_ai.sh '#{pane_current_path}'"
bind-key -n M-r display-popup -d "#{pane_current_path}" -xC -yC -w 85% -h 80% -E -b rounded -T " ⚡ 极速命令运行台 (按 Alt+r 隐退/唤出) " "/home/zxf/.local/bin/tmux_popup_runner.sh '#{pane_current_path}'"
bind-key -n M-s display-popup -E -w 50% -h 40% -b rounded -T " 🚀 切换项目 " "tmux list-sessions -F '#{session_name}' | fzf --reverse --prompt='🚀 切换项目 > ' | xargs -r tmux switch-client -t"
bind-key -n M-l switch-client -l
bind-key -n M-[ switch-client -p
bind-key -n M-] switch-client -n



# 9. TPM 插件管理与会话恢复持久化（tmux-resurrect & tmux-continuum）
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# 配置 resurrect：保存并恢复 ssh、bash 进程以及窗格内容
set -g @resurrect-processes 'ssh bash'
set -g @resurrect-capture-pane-contents 'on'

# 配置 continuum：开启定时自动保存（每 10 分钟）与启动自动恢复
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# 初始化 TPM（必须保持在 ~/.tmux.conf 最底端）
run '~/.tmux/plugins/tpm/tpm'

